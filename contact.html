<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Acquileadz to discuss your contractor acquisition needs. Get more booked jobs with our proven lead management system.">
    <title>Contact | Acquileadz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
</head>

<body>
    <nav class="nav">
        <div class="nav-logo">
            <a href="index.html" aria-label="Go to homepage">
                <img src="assets/logo-dark.png" alt="Acquileadz Logo">
            </a>
        </div>
        <button class="mobile-menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="cta-btn active">Contact</a>
        </div>
    </nav>

    <section class="contact-header">
        <h1>Get In Touch</h1>
        <p>Let's talk about getting you more booked jobs.</p>
    </section>

    <section class="contact-form-section">
        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="1b112abb-70d7-4e79-a0af-5d0b3e425015">
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
            
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="text" name="company" placeholder="Business Name">
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="phone" placeholder="Phone" required>
            <textarea name="message" placeholder="How can we help?" required></textarea>
            
            <div id="result" style="display: none; padding: 14px; border-radius: 6px; margin-bottom: 10px;"></div>
            
            <button type="submit" class="cta-btn-large">Send Message</button>
        </form>
    </section>

    <footer>
        <p>© 2025 Acquileadz. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

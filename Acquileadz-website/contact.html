<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Acquileadz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>

<body>
    <nav class="nav">
        <div class="nav-logo">
            <img src="assets/logo-light.png" alt="Logo">
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="cta-btn active">Contact</a>
        </div>
    </nav>

    <section class="contact-header">
        <h1>Get In Touch</h1>
        <p>Let’s talk about getting you more booked jobs.</p>
    </section>

    <section class="contact-form-section">
        <form class="contact-form" name="contact" method="POST" data-netlify="true">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="text" name="company" placeholder="Business Name">
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone" required>
            <textarea name="message" placeholder="How can we help?" required></textarea>
            <button type="submit" class="cta-btn-large">Send Message</button>
        </form>
    </section>

    <footer>
        <p>© 2025 Acquileadz. All rights reserved.</p>
    </footer>
</body>
</html>
